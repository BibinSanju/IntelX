services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: feeder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: placement_portal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d placement_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    container_name: feeder-executor
    restart: unless-stopped
    # No published port and no internet: only the backend can reach the sandbox.
    networks:
      - sandbox
    environment:
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?Set EXECUTOR_TOKEN in .env}
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feeder-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      executor:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: sh -c "npx prisma db push --accept-data-loss && node dist/index.js"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/placement_portal
      DIRECT_URL: postgresql://admin:adminpassword@postgres:5432/placement_portal
      EXECUTOR_URL: http://executor:8080
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?Set EXECUTOR_TOKEN in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    networks:
      - default
      - sandbox
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\""]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feeder-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:

networks:
  default:
  sandbox:
    internal: true
