name: 🌙 Nightly Problem Feeder Scraper

on:
  schedule:
    # Run every night at 18:30 UTC (12:00 AM / Midnight IST)
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      question_limit:
        description: 'Number of LeetCode questions to scrape and stage'
        required: true
        default: '10'
      theory_limit:
        description: 'Total source-balanced theory questions to scrape and stage'
        required: true
        default: '8'
      reddit_limit:
        description: 'Approved Reddit interview-recollection posts to stage'
        required: true
        default: '4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-stage:
    name: 📥 Scrape & Stage Questions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          cd scraper
          pip install -r requirements.txt

      - name: 🚀 Run Nightly Feeder Scraper
        run: |
          cd scraper
          if [ -z "$FEEDER_API_URL" ]; then
            echo "::error::FEEDER_API_URL secret is required because scraper ingestion must start the backend processing worker."
            exit 1
          fi
          LIMIT="${{ inputs.question_limit || '10' }}"
          THEORY_LIMIT="${{ inputs.theory_limit || '8' }}"
          REDDIT_LIMIT="${{ inputs.reddit_limit || '4' }}"
          python nightly_feeder.py "$LIMIT" "$THEORY_LIMIT" "$REDDIT_LIMIT"
        env:
          FEEDER_API_URL: ${{ secrets.FEEDER_API_URL }}
          REDDIT_API_APPROVED: ${{ vars.REDDIT_API_APPROVED }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          REDDIT_SUBREDDITS: ${{ vars.REDDIT_SUBREDDITS }}

      - name: 📊 Log Completion
        run: echo "✅ Nightly scraper completed and queued accepted questions for backend processing."
